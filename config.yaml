# 小米摄像头视频处理流水线 - 默认配置
# 可通过环境变量覆盖，详见 docker-compose.yml

directories:
  video_source: "/video"
  merge_output: "/input"
  compress_output: "/output"

merge:
  interval_minutes: 60
  delete_source: true

compress:
  codec: "libx265"
  resolution: "original"
  crf: 32
  preset: "fast"
  threads: 4
  audio_codec: "copy"
  delete_source: true

upload:
  type: "webdav"
  enabled: true
  webdav_url: ""
  webdav_user: ""
  webdav_pass: ""
  rate_limit: 0
  verify: true
  delete_after_upload: false
  resume: true
  max_retries: 3
  retry_delay: 30

logging:
  level: "INFO"
  format: "%(asctime)s - %(levelname)s - %(message)s"

performance:
  parallel: 1        # 并行压缩任务数，1=串行（旧行为）
  cores: 0           # 允许使用的 CPU 核心数，0=不限制
  core_list: ""      # 显式核心列表如 "0-3,6"，非空时优先于 cores
  bind: false        # 是否将每个 ffmpeg 进程绑定到分配的核心片上（防止线程乱跑）

webui:
  enabled: false     # 是否启用 WebUI 管理界面
  host: "0.0.0.0"    # WebUI 监听地址
  port: 8080         # WebUI 监听端口
